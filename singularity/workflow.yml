      maxQuestions: 5
      topics:
        - scope
        - acceptance criteria
        - actors
        - boundary conditions
        - non-functional requirements
      markers:
        mode: block
    specificationQuality:
      mode: enforce
      checklist: requirements-quality-v1
    writeScope: artifact-only
    approval:
      authorities:
        - product-approvers
      minimum: 1
      rejectTo:
        - specification
  planning:
    label: Planning
    defaultTemplate: spec-driven/plan.md
    artifact:
      path: artifacts/planning/plan.md
      kind: design
      minimumBytes: 300
