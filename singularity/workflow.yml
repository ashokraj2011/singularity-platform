        - engineering-reviewers
      requiredAuthorities:
        - quality-reviewers
      minimum: 1
      rejectTo:
        - poc-intake
        - poc-impact-analysis
        - poc-ui-exploration
        - poc-test-generation
        - poc-validation
        - poc-publication-review
