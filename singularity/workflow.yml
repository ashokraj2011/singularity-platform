      kind: verification-report
      minimumBytes: 200
    generation:
      requirement: required
      producer: deterministic
      task: analyze
    worldModel:
      views:
        - development
      depth: quick
    writeScope: artifact-only
    approval:
      authorities:
        - architecture-reviewers
      minimum: 1
      rejectTo:
