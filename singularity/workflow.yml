      minimumBytes: 200
    generation:
      requirement: required
      producer: deterministic
      task: analyze
    worldModel:
      views:
        - testing
      depth: quick
      evidence: true
    writeScope: source-and-artifact
    approval:
      mode: policy
      policy: quick-fix-low-risk-v1
      maximumChangedPaths: 5
      authorities:
        - quality-reviewers
      minimum: 1
      rejectTo:
        - implement
        - verify
    qualityCommands:
      - id: git-diff-check
        argv:
          - git
          - diff
          - --check
        modelPolicy: never
