approvalSecurity:
  profile: team
  allowSelfApproval: true
  autoEnrollNewIdentities: true
artifactSets:
  spec-driven-specification:
    primary: spec.md
    members:
      - path: spec.md
        role: specification
        required: true
      - path: checklists/requirements.md
        role: specification-quality
        required: false
        authority: advisory
  spec-driven-planning:
    primary: plan.md
    members:
      - path: plan.md
        role: implementation-plan
        required: true
      - path: tasks.md
        role: advisory-task-map
        required: false
        authority: advisory
  spec-driven-verification:
    primary: conformance.md
    members:
      - path: conformance.md
        role: conformance
        required: true
      - path: verification/
        role: evidence-collection
        required: true
ast:
  mode: auto
  fallback: host-and-text
  warmOnStoryStart:
    mode: background
    scope: configured-roots
  evidence:
    mode: replayable
    store: local-directory
  budgets:
    maxFiles: 500
    maxBytes: 20971520
    maxFileBytes: 2097152
auto:
  enabled: false
  defaultPace: phase
  defaultUntil: first-human-boundary
  workIdAllocator: ulid
  planTtlMinutes: 30
  execution:
    allowedHosts:
      - copilot-cli
    requireManagedWorktree: true
    automaticResume: false
    allowPolicyWaivers: false
    allowClarificationAnswers: false
    allowSequenceOverrides: false
    allowScopeExpansion: false
codeDelivery:
  schemaVersion: 2
  mode: enforce
  generationBoundary:
    requireBegin: true
    dirtyStart: block
  changeSet:
    renameDetection: required
    includeCommitted: true
    includeIndex: true
    includeWorktree: true
    includeUntracked: true
    symlinks: reject
  tests:
    requireExecutableSource: true
    minimumDiscovered: 1
    minimumPassed: 1
    executionAssurance: module
    stringCommands: reject
    unknownModelPolicy: block
    requireResultAdapter: true
    requireAffectedModuleCoverage: true
  traceability:
    source: pinned-spec-index
    requireNamespaceQualifiedIds: true
    bareIdCompatibility: unique-only
  publication:
    idempotency: generation-intent
  display:
    source: reference-preview
    previewBytes: 4096
    fullDocumentMaximumBytes: 65536
  model:
    minimumAssurance: unavailable
collaboration:
  assignmentMode: suggested
  approvalReminderAfterHours: 24
  notifications:
    - terminal
contextPolicy:
  onApproval: new
  onRejection: keep
  phaseOverrides: {}
defaultBaseBranch: main
documents:
  allowedPhases:
    - intake
    - requirements
    - design
    - implementation-spec
    - reproduction
    - fix-design
    - fix-spec
  maxFileBytes: 26214400
  maxPreviewBytes: 1048576
faultRepair:
  enabled: true
  maxAttempts: 3
  maxMinutes: 20
  maxTokens: 30000
  leaseMinutes: 60
  boundedAuto: false
  environmentCeilings:
    local: guided
    ide: guided
    copilot: guided
    ci: propose
    integration: propose
    staging: propose
    production: diagnose
  protectedPaths:
    - .git
    - singularity
    - infra/production
git:
  remote: origin
  publish: required
governance:
  requireAcceptanceCriteriaTags: true
  protectedPaths:
    - singularity/workflow.yml
    - singularity/impact.yml
    - singularity/agent-mappings.yml
    - singularity/agents.lock.yml
    - singularity/templates
    - singularity/agents
    - singularity/prompts
    - .github/agents
    - plugin/agents
    - plugin/skills
    - .github/skills
harnessImports:
  mode: record
  previewTextBytes: 16384
  totalEnvelopeBytes: 32768
  knowledge:
    enabled: true
    maximumBytes: 8192
  conformance:
    questionPrecedesMutation: warn
    maximumActions: observe
idPattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
inputsMode: enforce
ledger:
  behind: warn
  branch: state
  enabled: true
  enforcement: shadow
  maxRetries: 4
  pinTransport: refs
  publication: warn
  remote: origin
  retentionDays: 2555
  signing: off
  trustTier: T0
logging:
  level: info
  console: warn
  maxBytes: 5242880
  keep: 3
mcpServers:
  figma:
    label: Figma design context
    hostReference: figma
    agents:
      - product-designer
    phases:
      - design-intake
      - design-inventory
      - component-mapping
      - mobile-spec
      - visual-verification
    tools:
      - get_metadata
      - get_design_context
      - get_screenshot
      - get_variable_defs
      - get_code_connect_map
    required: false
    approval: confirm
    evidence:
      captureToolCalls: true
      captureResults: true
  playwright:
    label: Playwright browser automation
    hostReference: playwright
    agents:
      - qa
      - product-designer
      - poc-automation
      - poc-explorer
      - poc-validator
    phases:
      - design-intake
      - design-inventory
      - verification
      - visual-verification
      - conformance
      - poc-ui-exploration
      - poc-validation
    tools:
      - browser_navigate
      - browser_snapshot
      - browser_click
      - browser_fill_form
      - browser_hover
      - browser_press_key
      - browser_resize
      - browser_take_screenshot
      - browser_console_messages
      - browser_network_requests
    required: false
    approval: confirm
    evidence:
      captureToolCalls: true
      captureResults: true
models:
  defaultProvider: copilot-cli
  providers:
    copilot-cli:
      type: copilot-cli
      executable: copilot
      promptTransport: auto
      arguments: []
noModel:
  unknownExternalCommands: warn
