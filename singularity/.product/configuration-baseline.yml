format: singularity-flow-configuration-baseline/v1
product:
  version: 0.9.0
  revision: 5fd72160afe0e54d393c99f652dc69ef04377bc9
workflow:
  version: 2
  inputsMode: enforce
  harnessImports:
    mode: record
    previewTextBytes: 16384
    totalEnvelopeBytes: 32768
    knowledge:
      enabled: true
      maximumBytes: 8192
    conformance:
      questionPrecedesMutation: warn
      maximumActions: observe
  contextPolicy:
    onApproval: new
    onRejection: keep
    phaseOverrides: {}
  sequenceGates:
    default: soft
    completion: hard
    currentPhase: hard
    freshGeneration: hard
    generationCommit: hard
    remoteGeneration: hard
    publicationPending: hard
  defaultBaseBranch: main
  workItemRoot: singularity/work-items
  idPattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  auto:
    enabled: false
    defaultPace: phase
    defaultUntil: first-human-boundary
    workIdAllocator: ulid
    planTtlMinutes: 30
    execution:
      allowedHosts:
        - copilot-cli
      requireManagedWorktree: true
      automaticResume: false
      allowPolicyWaivers: false
      allowClarificationAnswers: false
      allowSequenceOverrides: false
      allowScopeExpansion: false
  git:
    remote: origin
    publish: required
  ledger:
    enabled: false
    branch: state
    remote: origin
    publication: warn
    behind: warn
    enforcement: shadow
    signing: off
    trustTier: T0
    maxRetries: 4
    pinTransport: refs
    retentionDays: 2555
  templatesRoot: singularity/templates
  noModel:
    unknownExternalCommands: warn
  codeDelivery:
    schemaVersion: 2
    mode: enforce
    generationBoundary:
      requireBegin: true
      dirtyStart: block
    changeSet:
      renameDetection: required
      includeCommitted: true
      includeIndex: true
      includeWorktree: true
      includeUntracked: true
      symlinks: reject
    tests:
      requireExecutableSource: true
      minimumDiscovered: 1
      minimumPassed: 1
      executionAssurance: module
      stringCommands: reject
      unknownModelPolicy: block
      requireResultAdapter: true
      requireAffectedModuleCoverage: true
    traceability:
      source: pinned-spec-index
      requireNamespaceQualifiedIds: true
      bareIdCompatibility: unique-only
    publication:
      idempotency: generation-intent
    display:
      source: reference-preview
      previewBytes: 4096
      fullDocumentMaximumBytes: 65536
    model:
      minimumAssurance: unavailable
  planning:
    enabled: true
    promptSource: singularity/prompts/copilot-planning.md
    maxContextBytes: 1048576
  worldModel:
    views:
      - business
      - architecture
      - development
      - testing
      - release
      - operations
      - security
    outputDir: singularity/world-model
    promptSource: singularity/prompts/worldmodel-builder.md
    stateFetchTimeoutMs: 10000
    generation:
      parallel: true
      maxWorkers: 4
      strategy: view
      maximumDiscoveryPacketBytes: 24576
      maximumSynthesisInputTokens: 24000
      synthesisOverflow: summarize-or-refuse
    materialization:
      mode: explicit
      publish: governed
      lookahead: none
      depth: phase
      confirmation: prompt
    grounding: warn
    staleness: warn
    injection:
      placeholder: "{{WORLD_MODEL}}"
      mode: append
      maxBytes: 32768
      rules: []
  ast:
    mode: auto
    fallback: host-and-text
    warmOnStoryStart:
      mode: background
      scope: configured-roots
    evidence:
      mode: replayable
      store: local-directory
    budgets:
      maxFiles: 500
      maxBytes: 20971520
      maxFileBytes: 2097152
  models:
    defaultProvider: copilot-cli
    providers:
      copilot-cli:
        type: copilot-cli
        executable: copilot
        promptTransport: auto
        arguments: []
  tokens:
    mode: exact-or-unavailable
  tokenEconomy:
    enabled: true
    mode: observe
    profile: standard
    profiles:
      standard:
        maximumEstimatedPromptTokens: 18000
        reservedOutputTokens: 6000
        maxExpansionTokens: 8000
        observationCapsuleTokens: 3000
        policyOnBudgetBreach: refuse
    observationFirewall: true
    progressiveRetrieval: true
    historicalMemory: false
    cacheStableComposition: true
    providerTelemetry: optional
    ast: optional
  spec:
    mode: record
    coverage: record
    acceptance: presence
    compositionCache: local
    testCommands: {}
    excludes: []
  faultRepair:
    enabled: true
    maxAttempts: 3
    maxMinutes: 20
    maxTokens: 30000
    leaseMinutes: 60
    boundedAuto: false
    environmentCeilings:
      local: guided
      ide: guided
      copilot: guided
      ci: propose
      integration: propose
      staging: propose
      production: diagnose
    protectedPaths:
      - .git
      - singularity
      - infra/production
  documents:
    allowedPhases:
      - intake
      - requirements
      - design
      - implementation-spec
      - reproduction
      - fix-design
      - fix-spec
    maxFileBytes: 26214400
    maxPreviewBytes: 1048576
  collaboration:
    assignmentMode: suggested
    approvalReminderAfterHours: 24
    notifications:
      - terminal
  logging:
    level: info
    console: warn
    maxBytes: 5242880
    keep: 3
  session:
    workItemSelection: prompt
    requireBeforeTools: false
  mcpServers:
    figma:
      label: Figma design context
      hostReference: figma
      agents:
        - product-designer
      phases:
        - design-intake
        - design-inventory
        - component-mapping
        - mobile-spec
        - visual-verification
      tools:
        - get_metadata
        - get_design_context
        - get_screenshot
        - get_variable_defs
        - get_code_connect_map
      required: false
      approval: confirm
      evidence:
        captureToolCalls: true
        captureResults: true
    playwright:
      label: Playwright browser automation
      hostReference: playwright
      agents:
        - qa
        - product-designer
        - poc-automation
        - poc-explorer
        - poc-validator
      phases:
        - design-intake
        - design-inventory
        - verification
        - visual-verification
        - conformance
        - poc-ui-exploration
        - poc-validation
      tools:
        - browser_navigate
        - browser_snapshot
        - browser_click
        - browser_fill_form
        - browser_hover
        - browser_press_key
        - browser_resize
        - browser_take_screenshot
        - browser_console_messages
        - browser_network_requests
      required: false
      approval: confirm
      evidence:
        captureToolCalls: true
        captureResults: true
  approvalSecurity:
    profile: team
    allowSelfApproval: true
    autoEnrollNewIdentities: true
  approvalAuthorities:
    product-approvers:
      label: Product approvers
      allowAnyGitIdentity: false
      members: []
    architecture-reviewers:
      label: Architecture reviewers
      allowAnyGitIdentity: false
      members: []
    engineering-reviewers:
      label: Engineering reviewers
      allowAnyGitIdentity: false
      members: []
    quality-reviewers:
      label: Quality reviewers
      allowAnyGitIdentity: false
      members: []
    design-reviewers:
      label: Design reviewers
      allowAnyGitIdentity: false
      members: []
  artifactSets:
    spec-driven-specification:
      primary: spec.md
      members:
        - path: spec.md
          role: specification
          required: true
        - path: checklists/requirements.md
          role: specification-quality
          required: false
          authority: advisory
    spec-driven-planning:
      primary: plan.md
      members:
        - path: plan.md
          role: implementation-plan
          required: true
        - path: tasks.md
          role: advisory-task-map
          required: false
          authority: advisory
    spec-driven-verification:
      primary: conformance.md
      members:
        - path: conformance.md
          role: conformance
          required: true
        - path: verification/
          role: evidence-collection
          required: true
  workTypes:
    feature:
      label: Feature
      phases:
        - intake
        - requirements
        - design
        - implementation-spec
        - implementation
        - verification
        - conformance
      templateOverrides:
        intake: feature/intake.md
        requirements: feature/requirements.md
        design: feature/design.md
        implementation-spec: feature/implementation-spec.md
      phaseOverrides:
        requirements:
          inputs:
            - intake
        design:
          inputs:
            - requirements
        implementation-spec:
          inputs:
            - requirements
            - design
        implementation:
          inputs:
            - design
            - implementation-spec
        verification:
          inputs:
            - implementation-spec
            - implementation
        conformance:
          inputs:
            - implementation-spec
            - implementation
            - verification
    bugfix:
      label: Bug fix
      phases:
        - intake
        - reproduction
        - fix-design
        - fix-spec
        - implementation
        - verification
        - conformance
      templateOverrides:
        intake: bugfix/intake.md
        reproduction: bugfix/reproduction.md
        fix-design: bugfix/fix-design.md
        fix-spec: bugfix/fix-spec.md
      phaseOverrides:
        reproduction:
          inputs:
            - intake
        fix-design:
          inputs:
            - reproduction
        fix-spec:
          inputs:
            - reproduction
            - fix-design
        implementation:
          inputs:
            - fix-spec
        verification:
          inputs:
            - fix-spec
            - implementation
        conformance:
          inputs:
            - fix-spec
            - implementation
            - verification
    chore:
      label: Chore
      phases:
        - intake
        - implementation
        - verification
        - conformance
      templateOverrides:
        intake: chore/intake.md
      phaseOverrides:
        implementation:
          inputs:
            - intake
          generation:
            task: analyze
        verification:
          inputs:
            - implementation
        conformance:
          inputs:
            - implementation
            - verification
    figma-mobile:
      label: Figma export to mobile app
      phases:
        - design-intake
        - design-inventory
        - component-mapping
        - mobile-spec
        - implementation
        - visual-verification
        - conformance
      designSources:
        capturePhase: design-intake
        consumeIn:
          - design-inventory
          - component-mapping
          - mobile-spec
          - visual-verification
          - conformance
        staleness: warn
        requireApprovedSet: true
        inventoryDigest: optional
      verification:
        coverage: enforce
        profiles:
          - id: phone-390x844
            label: Phone 390 × 844
            width: 390
            height: 844
            deviceScaleFactor: 1
          - id: tablet-834x1194
            label: Tablet 834 × 1194
            width: 834
            height: 1194
            deviceScaleFactor: 1
        comparison:
          mode: warn
          channelTolerance: 8
          maxDifferingPixelRatio: 0.02
          maxDifferingPixels: null
          maxPixels: 40000000
      documents:
        allowedPhases:
          - design-intake
          - design-inventory
      templateOverrides:
        design-intake: figma-mobile/design-intake.md
        design-inventory: figma-mobile/design-inventory.md
        component-mapping: figma-mobile/component-mapping.md
        mobile-spec: figma-mobile/mobile-spec.md
        implementation: figma-mobile/implementation.md
        visual-verification: figma-mobile/visual-verification.md
        conformance: figma-mobile/conformance.md
      phaseOverrides:
        design-inventory:
          inputs:
            - design-intake
        component-mapping:
          inputs:
            - design-inventory
        mobile-spec:
          inputs:
            - design-inventory
            - component-mapping
        implementation:
          inputs:
            - component-mapping
            - mobile-spec
        visual-verification:
          inputs:
            - design-inventory
            - mobile-spec
            - implementation
        conformance:
          inputs:
            - mobile-spec
            - implementation
            - visual-verification
          approval:
            authorities:
              - design-reviewers
              - architecture-reviewers
              - quality-reviewers
            minimum: 1
            rejectTo:
              - design-inventory
              - component-mapping
              - mobile-spec
              - implementation
              - visual-verification
              - conformance
      sequenceGates:
        documentPhase: hard
    quick-fix:
      label: Quick fix
      phases:
        - implement
        - verify
      templateOverrides:
        implement: quick-fix/implement.md
        verify: quick-fix/verify.md
      phaseOverrides:
        verify:
          inputs:
            - implement
    benchmarking-a:
      label: Benchmark A — governed intelligence
      description: Requires governed world-model, bounded AST, and approval-bound
        agent-brief context.
      phases:
        - intake
        - design
        - implementation
        - testing
        - conformance
      intelligence:
        worldModel: required
        ast: optional-context
        agentBriefs: required
      templateOverrides:
        intake: benchmark/intake.md
        design: benchmark/design.md
        implementation: benchmark/implementation.md
        testing: benchmark/testing.md
        conformance: benchmark/conformance.md
      phaseOverrides:
        design:
          inputs:
            - phase: intake
              projection: approved-summary
              preserve:
                - Success criteria
                - Scope and constraints
              maximumSummaryBytes: 16384
              expansion: hash-bound-reference
              fallback: block
          approval:
            authorities:
              - architecture-reviewers
            minimum: 1
            rejectTo:
              - intake
              - design
        implementation:
          inputs:
            - phase: design
              projection: approved-summary
              preserve:
                - Design and interfaces
                - Risks and rollback
              maximumSummaryBytes: 16384
              expansion: hash-bound-reference
              fallback: block
        testing:
          inputs:
            - phase: intake
              projection: approved-summary
              preserve:
                - Success criteria
              maximumSummaryBytes: 12288
              expansion: hash-bound-reference
              fallback: block
            - phase: implementation
              projection: approved-summary
              preserve:
                - Changed components
                - Validation and operational notes
              maximumSummaryBytes: 16384
              expansion: hash-bound-reference
              fallback: block
        conformance:
          inputs:
            - phase: intake
              projection: approved-summary
              preserve:
                - Success criteria
              maximumSummaryBytes: 12288
              expansion: hash-bound-reference
              fallback: block
            - phase: design
              projection: approved-summary
              preserve:
                - Design and interfaces
              maximumSummaryBytes: 12288
              expansion: hash-bound-reference
              fallback: block
            - phase: implementation
              projection: approved-summary
              preserve:
                - Changed components
              maximumSummaryBytes: 12288
              expansion: hash-bound-reference
              fallback: block
            - phase: testing
              projection: approved-summary
              preserve:
                - Test evidence and results
              maximumSummaryBytes: 16384
              expansion: hash-bound-reference
              fallback: block
          approval:
            authorities:
              - quality-reviewers
              - architecture-reviewers
            minimum: 1
            rejectTo:
              - design
              - implementation
              - testing
              - conformance
    benchmarking-b:
      label: Benchmark B — generic context
      description: Uses full approved artifacts without world-model, AST, or
        agent-brief enrichment.
      phases:
        - intake
        - design
        - implementation
        - testing
        - conformance
      intelligence:
        worldModel: off
        ast: off
        agentBriefs: off
      templateOverrides:
        intake: benchmark/intake.md
        design: benchmark/design.md
        implementation: benchmark/implementation.md
        testing: benchmark/testing.md
        conformance: benchmark/conformance.md
      phaseOverrides:
        intake:
          worldModel:
            views: []
        design:
          inputs:
            - intake
          worldModel:
            views: []
          approval:
            authorities:
              - architecture-reviewers
            minimum: 1
            rejectTo:
              - intake
              - design
        implementation:
          inputs:
            - design
          worldModel:
            views: []
        testing:
          inputs:
            - intake
            - implementation
          worldModel:
            views: []
        conformance:
          inputs:
            - intake
            - design
            - implementation
            - testing
          worldModel:
            views: []
          approval:
            authorities:
              - quality-reviewers
              - architecture-reviewers
            minimum: 1
            rejectTo:
              - design
              - implementation
              - testing
              - conformance
    poc-workflow:
      label: POC workflow
      phases:
        - poc-intake
        - poc-impact-analysis
        - poc-ui-exploration
        - poc-test-generation
        - poc-validation
        - poc-publication-review
      templateOverrides:
        poc-intake: poc-workflow/intake.md
        poc-impact-analysis: poc-workflow/impact-analysis.md
        poc-ui-exploration: poc-workflow/ui-exploration.md
        poc-test-generation: poc-workflow/test-generation.md
        poc-validation: poc-workflow/validation.md
        poc-publication-review: poc-workflow/publication-review.md
      phaseOverrides:
        poc-impact-analysis:
          inputs:
            - poc-intake
        poc-ui-exploration:
          inputs:
            - poc-intake
            - poc-impact-analysis
        poc-test-generation:
          inputs:
            - poc-intake
            - poc-impact-analysis
            - poc-ui-exploration
        poc-validation:
          inputs:
            - poc-impact-analysis
            - poc-ui-exploration
            - poc-test-generation
        poc-publication-review:
          inputs:
            - poc-intake
            - poc-impact-analysis
            - poc-ui-exploration
            - poc-test-generation
            - poc-validation
    spec-driven-standard:
      label: Spec-Driven Standard
      spec:
        mode: enforce
      phases:
        - specification
        - planning
        - implementation
        - convergence
        - verification
        - release
      fastPath:
        specify:
          milestone: specification-approved
        plan:
          milestone: planning-approved
        implement:
          milestone: implementation-published
        converge:
          milestone: convergence-advanced
        verify:
          milestone: verification-approved
      constitution:
        path: singularity/constitution.md
        mode: warn
      templateOverrides:
        specification: spec-driven/spec.md
        planning: spec-driven/plan.md
        convergence: spec-driven/convergence.md
      phaseOverrides:
        planning:
          inputs:
            - phase: specification
              projection: approved-summary
              preserve:
                - Requirements
                - Non-functional requirements
                - Boundary conditions
              maximumSummaryBytes: 32768
              expansion: hash-bound-reference
              fallback: whole
        implementation:
          inputs:
            - phase: specification
              projection: approved-summary
              preserve:
                - Requirements
                - Non-functional requirements
                - Boundary conditions
              maximumSummaryBytes: 32768
              expansion: hash-bound-reference
              fallback: whole
            - phase: planning
              projection: approved-summary
              preserve:
                - Test strategy
                - Risks and rollback
              maximumSummaryBytes: 24576
              expansion: hash-bound-reference
              fallback: whole
        convergence:
          inputs:
            - phase: specification
              projection: approved-summary
              preserve:
                - Requirements
                - Non-functional requirements
                - Boundary conditions
              maximumSummaryBytes: 32768
              expansion: hash-bound-reference
              fallback: whole
            - phase: planning
              projection: approved-summary
              preserve:
                - Test strategy
                - Risks and rollback
              maximumSummaryBytes: 24576
              expansion: hash-bound-reference
              fallback: whole
            - phase: implementation
              projection: approved-summary
              preserve:
                - Changed components and decisions
                - Tests and operational notes
              maximumSummaryBytes: 24576
              expansion: hash-bound-reference
              fallback: whole
        verification:
          inputs:
            - phase: specification
              projection: approved-summary
              preserve:
                - Requirements
                - Non-functional requirements
                - Boundary conditions
              maximumSummaryBytes: 32768
              expansion: hash-bound-reference
              fallback: whole
            - phase: planning
              projection: approved-summary
              preserve:
                - Test strategy
                - Risks and rollback
              maximumSummaryBytes: 24576
              expansion: hash-bound-reference
              fallback: whole
            - phase: implementation
              projection: approved-summary
              preserve:
                - Changed components and decisions
                - Tests and operational notes
              maximumSummaryBytes: 24576
              expansion: hash-bound-reference
              fallback: whole
        release:
          inputs:
            - phase: verification
              projection: approved-summary
              preserve:
